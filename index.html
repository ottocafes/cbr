:root{
  --verde:#1B7A3E; --amarelo:#FFD700; --branco:#FFFFFF; --cinza:#F5F5F2; --texto:#3C3C3C;
  --ok-txt:#1B7A3E; --ok-bg:#E8F3EC; --al-txt:#7A4F00; --al-bg:#FFF4CC;
  --page:#CFE3C0; --panel:#FFFFFF; --panel-txt:#3C3C3C; --veil:#14251ACC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#16281C; } }
:root[data-theme="dark"]{ --page:#16281C; }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ height:100%; margin:0; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{ background:var(--page); font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; color:var(--texto); font-size:16px; line-height:1.5; }
h1,h2,h3,.bc{ font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif; font-weight:700; letter-spacing:.2px; margin:0; }
#app{ position:relative; height:100%; overflow:hidden; }
#map{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:pointer; }
.hud{ position:absolute; left:0; right:0; top:0; display:flex; gap:8px; align-items:center; padding:10px 12px; pointer-events:none; }
.hud > *{ pointer-events:auto; }
.goal{ flex:1; min-width:0; background:var(--panel); color:var(--panel-txt); border-radius:12px; padding:8px 12px; border:2px solid var(--verde); }
.goal small{ display:block; font-size:14px; color:var(--verde); font-weight:700; }
.goal span{ display:block; font-weight:500; line-height:1.25; }
.hbtn{ min-height:48px; min-width:48px; border:0; border-radius:12px; background:var(--verde); color:var(--branco); font:700 18px/1 "Barlow Condensed",Arial,sans-serif; padding:0 14px; cursor:pointer; }
.hbtn.sec{ background:var(--panel); color:var(--verde); border:2px solid var(--verde); }
.hint{ position:absolute; z-index:5; left:50%; bottom:calc(14px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--panel); color:var(--panel-txt); border-radius:16px; padding:8px 16px; font-size:14px; border:1px solid var(--verde); max-width:92%; text-align:center; }
button:focus-visible,input:focus-visible{ outline:3px solid var(--texto); outline-offset:2px; }
.overlay{ position:absolute; inset:0; z-index:10; display:none; align-items:center; justify-content:center; padding:16px; background:var(--veil); overflow:auto; }
.overlay.open{ display:flex; }
.overlay.bottom{ align-items:flex-end; background:transparent; pointer-events:none; }
.overlay.bottom .panel{ pointer-events:auto; }
.panel{ width:100%; max-width:580px; background:var(--panel); color:var(--panel-txt); border-radius:16px; padding:20px; border:2px solid var(--verde); margin:auto 0; }
.overlay.bottom .panel{ margin:0 0 calc(8px + env(safe-area-inset-bottom,0px)); }
.speaker{ display:flex; gap:14px; align-items:flex-start; }
.speaker svg{ flex:0 0 72px; width:72px; height:72px; }

<body>
<div id="app">
  <canvas id="map" aria-label="Mapa de Cajamar. Toque ou clique no chão para andar; use as setas do teclado para andar um passo." role="img"></canvas>

</div>

<script>
(function(){
"use strict";

/* ---------- conteúdo (fontes declaradas no final do jogo) ---------- */
const SRC_PM = "Fonte: Plano de Manejo do Parque Natural Municipal de Cajamar, normas gerais.";
const QUIZ = [
  { q:"Qual é a altitude do ponto mais alto de Cajamar?", o:["1.083 metros","730 metros","1.500 metros"], c:0 },
  { q:"Que tipo de unidade de conservação é o Parque Natural Municipal de Cajamar?", o:["Proteção integral","Uso sustentável","Não é unidade de conservação"], c:0 },
  { q:"Qual serra faz parte do território de Cajamar?", o:["Serra do Japi","Serra da Canastra","Serra dos Órgãos"], c:0 },
  { q:"O que se produzia nos Fornos do Ponunduva?", o:["Cal","Carvão","Tijolo"], c:0 },
  { q:"Qual festa tradicional tem como palco o Boiódromo?", o:["Festa do Peão","Festa da Uva","Oktoberfest"], c:0 }
];
const STAMPS = [
  { t:"Parque Natural Municipal", f:"Primeira unidade de conservação municipal de Cajamar, do grupo de proteção integral. Protege a Mata Atlântica.", src:"Plano de Manejo do Parque Natural Municipal de Cajamar; Lei federal 9.985/2000 (SNUC)." },
  { t:"Morro da Placa", f:"Ponto mais alto de Cajamar, com 1.083 metros. A altitude média do município é de 730 metros.", src:"Plano Diretor de Turismo de Cajamar." },
  { t:"Serra do Japi", f:"Faz parte do território de Cajamar, e parte dela fica dentro da APA Cajamar.", src:"Plano Diretor de Turismo de Cajamar." },
  { t:"Fornos do Ponunduva", f:"Ruínas de fornos de calcinação de calcário, onde se produzia cal. Segundo relatos históricos reunidos pela Prefeitura, a construção começou na década de 1940.", src:"Prefeitura de Cajamar, página de atrativos turísticos." },
  { t:"Boiódromo", f:"Centro de Eventos Professor Walter Ribas de Andrade, inaugurado em 30 de abril de 1992 e palco da Festa do Peão. Na pesquisa do Rodeo Fest 2026, 61,4% dos visitantes que responderam disseram querer conhecer mais Cajamar.", src:"Observatório de Turismo de Cajamar, Pesquisa de Perfil do Visitante, Rodeo Fest 2026." }
];
const STAMP_SCENE = ["ponunduva","ponunduva","ponunduva","ponunduva","jordanesia"];
const AVATARS = [
  { n:"Exploradora", skin:"#8D5A3B", shirt:"#2E86C1", hat:"#1B7A3E", hair:"#2B1A10", long:true },
  { n:"Explorador", skin:"#F1C7A1", shirt:"#C0392B", hat:"#3C3C3C", hair:"#7A4A1E" },
  { n:"Exploradora com prótese na perna", skin:"#F1C7A1", shirt:"#7D3C98", hat:"#D4A017", hair:"#B5651D", long:true, prosthesis:true },
  { n:"Explorador com bengala", skin:"#5A3825", shirt:"#E67E22", hat:"#1B7A3E", hair:"#1E1E1E", cane:true },
  { n:"Exploradora", skin:"#C68B59", shirt:"#16A085", hat:"#3C3C3C", hair:"#1E1E1E", long:true },
  { n:"Explorador", skin:"#C68B59", shirt:"#2C3E50", hat:"#D4A017", hair:"#2B1A10" }
];
/* ponto unico de configuracao por nivel: nesta versao so o Fundamental II esta ativo e todo o conteudo e dele */
const NIVEIS = {
  f1:{ ativo:false, rotulo:"Fundamental I", descricao:"Para turmas do 1º ao 5º ano" },
  f2:{ ativo:true, rotulo:"Fundamental II", descricao:"Para turmas do 6º ao 9º ano" },
  em:{ ativo:false, rotulo:"Ensino Médio", descricao:"Para turmas do Ensino Médio, técnico e EJA" },
  livre:{ ativo:false, rotulo:"Mundo livre", descricao:"Entre com sua conta de explorador do CircuitoBR" }
};

/* ---------- estado e armazenamento ---------- */
const KEY = "aracazinho-cajamar-v6";
let S = freshState();
function freshState(){ return { items:[], secrets:{}, view:"lateral", nivel:"f2", som:true, tutorial:false, tutorialCentro:false, survey:[], mode:"walk", turma:"", apelido:"", avatar:0, started:false, scene:null, steps:{centro:0,ponunduva:0,jordanesia:0}, posBy:{}, pre:[], post:[], stamps:[false,false,false,false,false], done:false }; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const r = localStorage.getItem(KEY); if(r){ const d = JSON.parse(r); if(d && typeof d === "object"){ const st = Object.assign(freshState(), d); if(d.tutorialCentro===undefined && d.steps && d.steps.centro>=1) st.tutorialCentro = true;
  if(d.tips===undefined){ st.tips = {}; if(st.tutorialCentro) Object.assign(st.tips, { objetivo:true, ir:true, interagir:true, caderno:true }); if(st.tutorial) Object.assign(st.tips, { board:true, desk:true, shelf:true }); } return st; } } }catch(e){} return null; }
function clearSave(){ try{ localStorage.removeItem(KEY); }catch(e){} }

/* ---------- mapa ---------- */
const TW = 64, TH = 32, EH = 20;
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const key = (x,y)=>x+","+y;
function grid(w,h,R){ const g=[]; for(let y=0;y<h;y++){ g[y]=[]; for(let x=0;x<w;x++) g[y][x]={ h:0, type:"grass", obj:null, s:0.85+R()*0.3 }; } return g; }

function buildPonunduva(){
  const W=12, H=34, R=rng(20261003), T=grid(W,H,R);
  const trail = [[6,10],[6,9],[6,8],[6,7],[5,7],[5,6],[4,6],[4,5],[4,4],[4,3],[3,3],[3,2]];
  const road = []; for(let y=10;y<=32;y++) road.push([6,y]);
  const clear = new Set();
  trail.concat(road).forEach(p=>clear.add(key(p[0],p[1])));
  for(let x=1;x<=7;x++) for(let y=28;y<=33;y++) clear.add(key(x,y));
  [[6,7],[4,5],[3,2],[6,10],[6,24],[6,31],[5,31]].forEach(([cx,cy])=>{ for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++) clear.add(key(cx+dx,cy+dy)); });
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const t = T[y][x];
    if(y<=9){ t.type="forest"; if(!clear.has(key(x,y)) && R()<0.78) t.obj="tree"; }
    else if(y<=16){ if(!clear.has(key(x,y)) && Math.abs(x-6)>1 && R()<0.14) t.obj="tree"; }
    else {
      const d = Math.hypot(x-6, y-24);
      t.h = Math.max(0, Math.min(5, Math.round(5 - d*0.9)));
      t.type = t.h>=4 ? "rock" : "hill";
      if(!clear.has(key(x,y)) && Math.abs(x-6)>1 && t.h<=1 && R()<0.35) t.obj="tree";
    }
  }
  trail.forEach(([x,y])=>{ T[y][x].type="trail"; T[y][x].obj=null; });
  road.forEach(([x,y])=>{ if(T[y][x].type!=="rock") T[y][x].type="trail"; T[y][x].obj=null; });
  T[10][6].obj="portal"; T[11][8].obj="picnic"; T[24][5].obj="mirante"; T[23][5].obj="placa";
  T[31][4].obj="fornos"; T[30][4].obj="block"; T[32][4].obj="block"; T[2][3].obj=null;
  return { id:"ponunduva", name:"Ponunduva", W, H, T, start:[6,13],
    labels:[["Parque Natural Municipal",4,4,0],["Morro da Placa",8,26,7],["Fornos do Ponunduva",2,30,6]],
    npcs:[], ambient:[],
    steps:[
      { t:[6,10], g:"Vá até a entrada do Parque Natural Municipal" },
      { t:[6,7],  g:"Siga a trilha do Parque" },
      { t:[4,5],  g:"Continue pela trilha" },
      { t:[3,2],  g:"Vá até o fim da trilha" },
      { t:[6,17], g:"Vá até o pé do Morro da Placa" },

function bfs(sx,sy,tx,ty){
  if(!walkable(tx,ty)) return null;
  const prev = new Map(), q = [[sx,sy]]; prev.set(key(sx,sy), null);
  while(q.length){
    const [x,y] = q.shift();
    if(x===tx && y===ty){ const out=[]; let k=key(x,y); while(k && k!==key(sx,sy)){ const [a,b]=k.split(",").map(Number); out.unshift([a,b]); k=prev.get(k); } return out; }
    for(const [dx,dy] of [[0,-1],[1,0],[0,1],[-1,0]]){
      const nx=x+dx, ny=y+dy, nk=key(nx,ny);
      if(prev.has(nk) || !walkable(nx,ny)) continue;
      if(Math.abs(T[ny][nx].h - T[y][x].h) > 1) continue;
      prev.set(nk, key(x,y)); q.push([nx,ny]);
    }
  }
  return null;
}
function goTo(tx,ty){ if(locked) return; GOAL=null; const p = bfs(P.x,P.y,tx,ty); if(p && p.length){ P.path = p; } }
function nearT(t){ return Math.abs(P.x-t[0])<=1 && Math.abs(P.y-t[1])<=1; }
function pathNear(tx,ty){
  const p = bfs(P.x,P.y,tx,ty); if(p) return p;
  let best = null;
  for(let r=1;r<=3 && !best;r++){
    for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;
      const x=tx+dx, y=ty+dy; if(!walkable(x,y)) continue;
      const q = bfs(P.x,P.y,x,y); if(!q) continue;
      const d = Math.hypot(dx,dy);

  }
  return best ? best.q : null;
}
function goNear(tx,ty){

  if(p.length){ const e=p[p.length-1], q=iso(e[0],e[1],T[e[1]][e[0]].h); markAt(q.x,q.y); }

}

function interview(nb, done){
  const tag='<div class="tag">Entrevista '+nb.n+' de 2 (simulação)</div>';

    const qs=[["mora","Você mora em Cajamar?"],["origem","De onde você veio?"],["dorme","Vai dormir em Cajamar?"]];
    open(tag+'<p class="qtext">Uma pessoa topou responder. Qual pergunta você faz primeiro?</p><div class="opts">'+shuffled(3).map(i=>'<button class="opt" data-q="'+qs[i][0]+'">'+esc(qs[i][1])+'</button>').join("")+'</div><div id="fb"></div>');

      if(skip){ step2(); return; }
      panel.querySelectorAll("[data-q]").forEach(x=>{ x.disabled=true; if(x.dataset.q==="mora") x.classList.add("is-right"); });

      const nx=document.getElementById("nx"); nx.focus(); nx.onclick=step2;
    });

    panel.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
      const pick=b.dataset.i==="1", right=pick===nb.record;

      if(!right) b.classList.add("was-bad");
      document.getElementById("fb").innerHTML='<div class="fb '+(right?"ok":"er")+'"><b>'+(right?"Isso.":"Não é bem assim.")+'</b>'+esc(nb.record?"É visitante: segue a entrevista.":nb.ok)+'</div><div class="row"><button class="btn" id="nx">Continuar</button></div>';
      const nx=document.getElementById("nx"); nx.focus(); nx.onclick= nb.record ? step3 : ()=>{ close(); done && done(); };
    });
  };
  const step3=()=>{
    open(tag+'<div class="chatlog">'+chatMe("Você mora em Cajamar?")+chatThem(nb.mora)+chatMe("De onde você veio?")+chatThem(nb.origem)+chatMe("Vai dormir em Cajamar?")+chatThem(nb.dorme)+'</div><div class="row"><button class="btn" id="nx">Registrar na ficha</button></div>');

    };
  };

}

function quiz(phase, done){
  let i = 0; const ORD = shuffled(QUIZ.length), ANS = Array(QUIZ.length).fill(-1);
  hud.hidden = true; hint.hidden = true; pad.hidden = true; playing = false; locked = true;
  const show = ()=>{
    const qi = ORD[i], q = QUIZ[qi];
    open('<div class="tag">'+(phase==="pre"?"Antes das missões":"Para terminar")+': pergunta '+(i+1)+' de '+QUIZ.length+'</div><p class="qtext">'+esc(q.q)+'</p>'+(phase==="pre"&&i===0?'<p class="small" style="margin:6px 0 0">Responda o que você acha. Não vale pesquisar: no final a gente compara.</p>':'')+'<div class="opts">'+shuffled(q.o.length).map(k=>'<button class="opt" data-k="'+k+'">'+esc(q.o[k])+'</button>').join("")+(phase==="pre"?'<button class="opt" data-k="-1">Não sei</button>':'')+'</div>'+(phase==="post"&&i===0?'<p class="small" style="margin:10px 0 0">Responda todas: é assim que você vê o quanto aprendeu.</p>':''));

  show();
}

}
function resume(){
  VIEW = S.view || "lateral";
  if(S.done){ if(VIEW==="lateral") beginPlace(S.lplace||"base"); else beginMapIso(S.scene||"centro"); return; }

}

const FINE = !!(window.matchMedia && window.matchMedia("(pointer: fine)").matches);

const TKEY = "aracazinho-teste";
function testLoad(){ let d=null; try{ const r = localStorage.getItem(TKEY); if(r) d = JSON.parse(r); }catch(e){} if(!d || typeof d!=="object") d = {}; if(!Array.isArray(d.dicas)) d.dicas=[]; if(!d.funil || typeof d.funil!=="object") d.funil={}; d.foraDoChao = d.foraDoChao||0; return d; }
function testSave(d){ try{ localStorage.setItem(TKEY, JSON.stringify(d)); }catch(e){} }

function mark(nome, reinicia){ if(!TESTE) return; const d=testLoad(); if(reinicia) d.funil={}; if(d.funil[nome]==null){ d.funil[nome]=Math.round(performance.now()/100)/10; testSave(d); } }

function testText(){
  const d = testLoad(), n = v=>String(v).replace(".",","), I = Object.assign({ des:0, des1:0, sit:0, sit1:0 }, S.ind||{});
  const L1 = ["FUNIL (segundos desde abrir a pagina)"].concat(Object.keys(d.funil).map(k=>k+"\t"+n(d.funil[k])));
  const L2 = ["", "DICAS", ["dica","visao","ponteiro","segundos_na_tela","como_terminou"].join("\t")].concat(d.dicas.map(r=>[r.dica,r.visao,r.ponteiro,n(r.s),r.fim].join("\t")));
  const L3 = ["", "INDICADORES", "toques_fora_do_chao\t"+d.foraDoChao, "desafios_respondidos\t"+I.des, "desafios_certos_de_primeira\t"+I.des1, "situacoes_respondidas\t"+I.sit, "situacoes_certas\t"+I.sit1, "carimbos\t"+S.stamps.filter(Boolean).length, "itens\t"+(S.items||[]).length, "visao\t"+(VIEW==="lateral"?"lateral":"de cima"), "ponteiro\t"+(FINE?"mouse":"toque")];
  const QZ = (arr,nome)=>!arr.length ? [] : [""].concat([nome]).concat(QUIZ.map((q,j)=>nome.toLowerCase()+"_item"+(j+1)+"\t"+(arr[j]===q.c?"certo":(arr[j]===-1?"nao_sei":"errado"))));

function drawTutTarget(now, sc, toScreen){
  const t = tutTarget(); if(!t){ TUT.hole=null; return; }
  const u = 1/sc, pu = reduced ? 0.5 : (Math.sin(now/220)+1)/2, scr = toScreen(t.x,t.y);

  if(cx!==scr[0] || cy!==scr[1]){
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.translate(cx,cy); ctx.rotate(Math.atan2(scr[1]-cy, scr[0]-cx));
    const b = reduced ? 0 : pu*6;
    ctx.beginPath(); ctx.moveTo(16+b,0); ctx.lineTo(-10+b,-14); ctx.lineTo(-10+b,14); ctx.closePath();
    ctx.fillStyle="#FFD700"; ctx.fill(); ctx.lineWidth=3; ctx.lineJoin="round"; ctx.strokeStyle="#1B7A3E"; ctx.stroke();
    ctx.restore(); TUT.hole = { x:cx, y:cy, r:26 }; return;
  }

function tone(f, d, type, vol, at, f2){

  try{ const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+(at||0);

    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+0.03); }catch(e){}
}

  const num = G.m.map((m,k)=>'<g><circle cx="'+m.x+'" cy="'+m.y+'" r="8.5" fill="'+(m.n==="Cajamar"?"#1B7A3E":"#FFFFFF")+'" stroke="#1B7A3E" stroke-width="1.2"/><text x="'+m.x+'" y="'+(m.y+3.6)+'" text-anchor="middle" font-family="DM Sans, Arial" font-size="10" font-weight="700" fill="'+(m.n==="Cajamar"?"#FFFFFF":"#3C3C3C")+'">'+(k+1)+'</text></g>').join("");
  const svg = '<svg viewBox="0 0 '+G.vw+' '+G.vh+'" style="width:100%;height:auto;max-height:60vh;display:block" role="img" aria-label="Mapa com os limites dos municípios: '+esc(G.t)+'"><rect width="'+G.vw+'" height="'+G.vh+'" rx="10" fill="#E8D6B5"/>'
    + G.m.map(m=>'<path d="'+m.d+'" fill="'+(m.n==="Cajamar"?"#FFD700":"#EEF4E6")+'" stroke="#1B7A3E" stroke-width="1.4" stroke-linejoin="round"/>').join("") + num + '</svg>';
  const lista = '<ol style="margin:8px 0 0;padding-left:22px;columns:2;column-gap:18px;font-size:15px">'+G.m.map(m=>'<li>'+(m.n==="Cajamar"?'<b>Cajamar</b>':esc(m.n))+'</li>').join("")+'</ol>';
  open('<div style="display:flex;align-items:center;justify-content:space-between;gap:14px"><div><div class="tag">Mapa da região: '+(i+1)+' de 2</div><h2>'+esc(G.t)+'</h2><p class="small" style="margin:2px 0 8px">'+esc(G.s)+'. Cajamar aparece em amarelo.</p></div>'+(IMG[G.id]?'<img src="'+IMG[G.id]+'" alt="Logo: '+esc(G.t)+'" style="height:68px;width:auto;flex:0 0 auto">':'')+'</div><div class="boardgrid"><div>'+svg+'</div><div>'+lista+'<p class="small" style="margin:10px 0 0">Limites: malha municipal do IBGE. '+esc(G.f)+'</p></div></div>'
    +'<div class="row"><button class="btn sec" id="rgO">'+(i===0 ? "Ver o "+esc(o.t)+" ▶" : "◀ Ver a "+esc(o.t))+'</button><button class="btn" id="nx" data-focus>Fechar mapa</button></div>', false, true);

}

function ico(k, px){ return '<span class="ico" aria-hidden="true" style="width:'+px+'px;height:'+px+'px">'+(ICO[k]||"")+'</span>'; }
const ICOIM = {}; for(const k in ICO){ ICOIM[k] = new Image(); ICOIM[k].src = "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(ICO[k]); }
function icoDraw(k, x, y, sz){ const im = ICOIM[k]; if(im && im.complete && im.naturalWidth>0) ctx.drawImage(im, x-sz/2, y-sz/2, sz, sz); }
/* bandeira de Cajamar: campo branco, oito faixas vermelhas com azul ao centro e o brasao no retangulo central */
function flagCAJ(x, y, w, h){
  rect(x,y,w,h,"#FFFFFF");
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  const cx=x+w/2, cy=y+h/2, band=(x1,y1,x2,y2)=>{ ctx.lineCap="butt"; ctx.strokeStyle="#E1251B"; ctx.lineWidth=h*0.13; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.strokeStyle="#2B1B8F"; ctx.lineWidth=h*0.04; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); };
  band(x,cy,x+w,cy); band(cx,y,cx,y+h); band(x-w*0.05,y-h*0.05,x+w*1.05,y+h*1.05); band(x-w*0.05,y+h*1.05,x+w*1.05,y-h*0.05);
  ctx.restore();
  const bw=w*0.42, bh=h*0.52; rect(cx-bw/2,cy-bh/2,bw,bh,"#FFFFFF");
  if(IMOK("brasao")){ const ih=bh*0.92, iw=ih*IM.brasao.naturalWidth/IM.brasao.naturalHeight; ctx.drawImage(IM.brasao,cx-iw/2,cy-ih/2,iw,ih); }
  ctx.strokeStyle="#C9C4B8"; ctx.lineWidth=0.6; ctx.strokeRect(x,y,w,h);
}

function lk(){ return Math.max(0.42, Math.min(1.4, Math.min(vw/820, vh/620))); }
function renderL(now){
  const p=PLACES[L.place]; if(!p) return;

  const g=p.ground;
  if(L.place==="externa"){ for(const a of AMB_L) drawPerson(a.x,-g(a.x)+30,a.a,2.3,0); p.hot.forEach(h=>{ if(h.npc!=null && S.steps.jordanesia<=h.step) drawPerson(h.x,-g(h.x)+30,NPCS_L[h.npc],2.3,0); }); }
  p.hot.forEach(h=>{ if(!(h.base || (h.extra && !hasItem(h.extra)))) return; const yy=-g(h.x)-(h.base?190:120); circ(h.x,yy,15,"#FFFFFF"); ctx.strokeStyle="#1B7A3E"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(h.x,yy,15,0,Math.PI*2); ctx.stroke(); ctx.fillStyle="#1B7A3E"; ctx.font="700 20px 'Barlow Condensed',Arial"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(h.base?"i":"+",h.x,yy+1); if(h.lb){ const fs=Math.max(16,13/k); ctx.font="700 "+fs+"px 'DM Sans',Arial"; const w=ctx.measureText(h.lb).width+16; rect(h.x-w/2,yy-30-fs,w,fs+10,"#FFFFFF"); ctx.fillStyle="#3C3C3C"; ctx.fillText(h.lb,h.x,yy-25-fs/2); } });
  if(L.place==="base" && quizPending()){ const b=reduced?0:Math.sin(now/260)*6, py=-250+b; ctx.fillStyle="#3C3C3C"; ctx.beginPath(); ctx.moveTo(700,py+12); ctx.lineTo(710,py+30); ctx.lineTo(720,py+12); ctx.closePath(); ctx.fill(); circ(710,py,16,"#3C3C3C"); circ(710,py,12,"#FFD700"); }
  const a=activeHot(); if(a){ const b = reduced?0:Math.sin(now/260)*6; const py=-g(a.x)-150+b; ctx.fillStyle="#3C3C3C"; ctx.beginPath(); ctx.moveTo(a.x-10,py+12); ctx.lineTo(a.x,py+30); ctx.lineTo(a.x+10,py+12); ctx.closePath(); ctx.fill(); circ(a.x,py,16,"#3C3C3C"); circ(a.x,py,12,"#FFD700");
    const sx = vw/2+(a.x-L.cam)*k; if(sx<24 || sx>vw-24){ const left = sx<24; ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.translate(left?30:vw-30, vh*LGF-110*k); if(left) ctx.scale(-1,1); const bb = reduced?0:Math.sin(now/220)*4; ctx.beginPath(); ctx.moveTo(16+bb,0); ctx.lineTo(-10+bb,-14); ctx.lineTo(-10+bb,14); ctx.closePath(); ctx.fillStyle="#FFD700"; ctx.fill(); ctx.lineWidth=3; ctx.lineJoin="round"; ctx.strokeStyle="#3C3C3C"; ctx.stroke(); ctx.restore(); } }
  if(p.left && L.cam - vw/(2*k) < 260) arrowSign(40,-g(40),"← "+p.leftLabel,true);
